name: Release

# Builds pbf-filter for Linux on x86_64 and arm64 (hikeratlas/basemap's
# jobs run on ubuntu-24.04-arm) and publishes them as a release's assets:
# pbf-filter-x86_64-linux, pbf-filter-aarch64-linux. Either push a tag
# vX.Y.Z, or run this workflow with a version, which tags the commit it
# runs on.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to create, e.g. v0.1.0
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --locked
      - run: cargo test --release --locked
      - run: cp target/release/pbf-filter pbf-filter-${{ matrix.arch }}-linux
      - uses: actions/upload-artifact@v4
        with:
          name: pbf-filter-${{ matrix.arch }}-linux
          path: pbf-filter-${{ matrix.arch }}-linux

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          chmod +x pbf-filter-*-linux
          gh release create "$TAG" pbf-filter-*-linux --repo "$GITHUB_REPOSITORY" --title "$TAG" \
            --target "$GITHUB_SHA" --generate-notes
